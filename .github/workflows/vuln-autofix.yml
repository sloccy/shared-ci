name: Go vuln auto-fix

on:
  workflow_call:
    secrets:
      pr_token:
        description: 'PAT for PR creation — skips close/reopen CI trigger workaround.'
        required: false

jobs:
  autofix:
    name: govulncheck & auto-fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        # setup-go exports GOTOOLCHAIN=local so no `go` command silently swaps toolchains.
        # govulncheck's go.mod floor moves independently of ours (v1.8.0 needs go >= 1.26.0
        # while go-version-file pins whatever the caller's go.mod says), so this one install
        # must be allowed to fetch the toolchain it needs. The scan itself stays pinned to
        # the caller's Go — see the env on the Scan/Verify steps below.
        env:
          GOTOOLCHAIN: auto
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan, parse, and bump vulnerable deps
        id: scan
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail

          # Exit code 3 = vulnerabilities found; allow it so the script can decide.
          govulncheck -json ./... > /tmp/vuln.json || true

          # Collect module@fixed_version for all called (symbol-level) findings.
          # finding.fixed_version is already the minimum fix >= the currently installed
          # version — no OSV range parsing needed.
          BUMPS_FILE=$(mktemp)
          jq -r '
            select(.finding) |
            select(.finding.trace[0]?.function != null) |
            select(.finding.fixed_version != null and .finding.fixed_version != "") |
            ((.finding.trace[0]?.module // "") | if . == "" then "stdlib" else . end) + "@" + .finding.fixed_version
          ' /tmp/vuln.json >> "$BUMPS_FILE"

          if [ ! -s "$BUMPS_FILE" ]; then
            echo "No called vulnerabilities found — nothing to do."
            echo "bumped=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Dedupe: per module keep the highest fixed version, so one bump covers all
          # called vulns in that module.
          # sort -k2,2V gives correct semver ordering; awk keeps the last (highest) per module.
          FINAL=$(sort -u "$BUMPS_FILE" \
            | sort -t '@' -k1,1 -k2,2V \
            | awk -F'@' '{ latest[$1] = $0 } END { for (m in latest) print latest[m] }')

          echo "Bumping: $FINAL"

          for bump in $FINAL; do
            module="${bump%%@*}"
            version="${bump##*@}"
            if [ "$module" = "stdlib" ]; then
              # fixed_version may be "goX.Y.Z" or "vX.Y.Z"; strip either prefix
              v="${version#go}"; go mod edit -go="${v#v}"
            else
              go get "$bump"
            fi
          done
          go mod tidy

          # Store bump list for the PR body.
          echo "bumped<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FINAL" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Detect token type
        id: token
        env:
          PR_TOKEN: ${{ secrets.pr_token }}
        run: |
          [ -n "$PR_TOKEN" ] && echo "use_pat=true" >> "$GITHUB_OUTPUT" || echo "use_pat=false" >> "$GITHUB_OUTPUT"

      - name: Verify no called vulns remain
        if: steps.scan.outputs.bumped != ''
        env:
          GOTOOLCHAIN: auto
        run: govulncheck ./...

      - name: Open PR
        id: create-pr
        if: steps.scan.outputs.bumped != ''
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.pr_token || secrets.GITHUB_TOKEN }}
          branch: chore/vuln-autofix
          commit-message: "chore: bump deps for govulncheck findings"
          title: "chore: bump deps for govulncheck findings"
          labels: security,dependencies
          body: |
            Automated dependency bump for Go vulnerabilities detected by `govulncheck`.

            **Bumped modules:**
            ```
            ${{ steps.scan.outputs.bumped }}
            ```

            All changes were verified clean by a second `govulncheck` pass.

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.pr_token || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          if [ "${{ steps.token.outputs.use_pat }}" != "true" ]; then
            # GITHUB_TOKEN events (including this close/reopen) can never start other
            # workflows, so without a pr_token PAT the PR's CI will not run and
            # auto-merge will wait forever on required checks. Warn instead of
            # pretending the old close/reopen dance works.
            echo "::warning::no pr_token PAT configured — CI will not trigger on this PR and auto-merge will stall until a human closes/reopens it or pushes to the branch"
          fi
          gh pr merge --auto --squash "$PR_NUM"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.pr_token || secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Needs `issues: write` in the CALLING repo's permissions block. Degrade to a
          # warning rather than masking the real failure above if that's not granted.
          existing=$(gh issue list --label vuln-autofix-failure --state open \
                       --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL" \
              || echo "::warning::could not comment on issue #$existing (needs issues: write in the caller's permissions)"
          else
            gh issue create --title "vuln-autofix is failing" \
              --label vuln-autofix-failure \
              --body "$(printf 'The scheduled govulncheck run is failing, so this repo has no vulnerability coverage until it'"'"'s fixed.\n\nLatest run: %s' "$RUN_URL")" \
              || echo "::warning::could not open an issue (needs issues: write in the caller's permissions)"
          fi
