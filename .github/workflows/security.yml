name: Security

# One nightly job per repo: scan -> fix -> test -> push to the default branch.
# See README.md for the policy and the caller template.
#
# Why a PAT pushes directly: a push made with GITHUB_TOKEN never triggers other
# workflows, so the repo's own publish/deploy workflow would not run. The owner's PAT
# (secret `token`) bypasses branch protection and starts the normal push workflows.

on:
  workflow_call:
    inputs:
      test_command:
        description: "Gate that must pass before pushing. Default: go build+test for Go, npm test for npm."
        type: string
        default: ""
      lint_command:
        description: "Optional extra gate (e.g. golangci-lint run ./...). Empty = lint runs only in the repo's normal CI."
        type: string
        default: ""
      extra_fix_script:
        description: "Optional repo script that bumps other pinned deps. It may append lines to $SUMMARY_FILE."
        type: string
        default: ""
      binaries:
        description: "Newline-separated URLs of Go binaries shipped with the project (scanned with govulncheck -mode=binary)."
        type: string
        default: ""
      rebuild_workflow:
        description: "Workflow file to dispatch weekly so base images/toolchains refresh (e.g. build.yml)."
        type: string
        default: ""
      rebuild_weekday:
        description: "Weekday for the rebuild, 1=Mon .. 7=Sun (UTC)."
        type: number
        default: 1
      force_rebuild:
        description: "Dispatch the rebuild workflow now regardless of weekday (testing)."
        type: boolean
        default: false
      dry_run:
        description: "Scan, fix and test, but do not push or dispatch anything."
        type: boolean
        default: false
      target_branch:
        description: "Branch to fix and push to instead of the default branch (testing)."
        type: string
        default: ""
      bump_actions:
        description: "Move version-pinned GitHub Actions (uses: owner/repo@vN) to the newest stable major. Needs a token that can write workflow files."
        type: boolean
        default: true
      actions_min_age_days:
        description: "Only adopt an action release that is at least this many days old."
        type: number
        default: 7
      watch_minutes:
        description: "After pushing an actions bump, wait up to this long for the repo's own build on that commit and fail (opening the failure issue) if it fails. 0 = do not wait."
        type: number
        default: 25
    secrets:
      token:
        description: "Owner PAT with Contents read/write (plus Workflows read/write to bump actions). Needed so the push triggers the repo's own workflows."
        required: true

permissions:
  contents: read
  issues: write  # failure report uses GITHUB_TOKEN so the PAT owner is not the author
  actions: write # dispatching the rebuild / re-enabling this workflow use GITHUB_TOKEN (workflow_dispatch is exempt from the no-trigger rule), so the PAT needs no Actions scope

jobs:
  security:
    name: Scan, fix, test, push
    runs-on: ubuntu-latest
    timeout-minutes: 75 # up to 25 of them can be spent watching the build after an actions bump
    env:
      GH_TOKEN: ${{ secrets.token }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.token }}
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Detect ecosystems
        id: detect
        run: |
          echo "SUMMARY_FILE=$RUNNER_TEMP/summary.md" >> "$GITHUB_ENV"
          echo "branch=$(git branch --show-current)" >> "$GITHUB_OUTPUT"
          [ -f go.mod ] && echo "go=true" >> "$GITHUB_OUTPUT" || echo "go=false" >> "$GITHUB_OUTPUT"
          [ -f package.json ] && echo "npm=true" >> "$GITHUB_OUTPUT" || echo "npm=false" >> "$GITHUB_OUTPUT"
          : > "$RUNNER_TEMP/summary.md"

      - uses: actions/setup-go@v6
        if: steps.detect.outputs.go == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-go@v6
        if: steps.detect.outputs.go != 'true' && inputs.binaries != ''
        with:
          go-version: stable

      - uses: actions/setup-node@v6
        if: steps.detect.outputs.npm == 'true'
        with:
          node-version: lts/*

      - name: Install govulncheck
        if: steps.detect.outputs.go == 'true' || inputs.binaries != ''
        env:
          # govulncheck's own go.mod floor moves independently of the project's Go
          # version, so this one install must be allowed to fetch the toolchain it needs.
          # (An unpinned install with GOTOOLCHAIN=local caused an 11-day silent outage.)
          GOTOOLCHAIN: auto
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # ── Fix: Go ────────────────────────────────────────────────────────────
      - name: Go - scan and bump vulnerable modules
        if: steps.detect.outputs.go == 'true'
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail

          # Policy: the minimum fixed version. For DIRECT dependencies only, then the newest
          # patch release in that same minor (patches are fixes only, so this picks up quiet
          # backports at almost no risk). Indirect modules and the Go toolchain version stay at
          # the minimum fix. Falls back to the minimum when no newer patch is found.
          newest_patch_module() { # $1=module $2=fixed (vX.Y.Z)
            local mod="$1" fixed="$2" cand
            [[ "$fixed" =~ ^v([0-9]+)[.]([0-9]+)[.][0-9]+$ ]] || { echo "$fixed"; return; }
            cand=$(go list -m -versions "$mod" 2>/dev/null | tr ' ' '\n' \
              | grep -E "^v${BASH_REMATCH[1]}[.]${BASH_REMATCH[2]}[.][0-9]+$" | sort -V | tail -1 || true)
            if [ -n "$cand" ] && [ "$(printf '%s\n%s\n' "$fixed" "$cand" | sort -V | tail -1)" = "$cand" ]; then
              echo "$cand"
            else
              echo "$fixed"
            fi
          }
          is_direct() { # required by this module itself (not an "// indirect" line in go.mod)
            [ "$(go list -m -f '{{.Indirect}}' "$1" 2>/dev/null || echo true)" = "false" ]
          }

          # One scan-and-bump pass. Returns 1 when there is nothing (left) to fix.
          go_pass() {
            # Exit code 3 = vulnerabilities found; the script decides what to do.
            govulncheck -json ./... > "$RUNNER_TEMP/vuln.json" || true

            # Only vulnerabilities in CALLED symbols, at the minimum fixed version.
            jq -r '
              select(.finding) |
              select(.finding.trace[0]?.function != null) |
              select(.finding.fixed_version != null and .finding.fixed_version != "") |
              ((.finding.trace[0]?.module // "") | if . == "" then "stdlib" else . end)
                + "@" + .finding.fixed_version + " " + .finding.osv
            ' "$RUNNER_TEMP/vuln.json" | sort -u > "$RUNNER_TEMP/found.txt"
            [ -s "$RUNNER_TEMP/found.txt" ] || return 1

            # One bump per module: the highest fixed version covers every finding in it.
            FINAL=$(cut -d' ' -f1 "$RUNNER_TEMP/found.txt" | sort -u \
              | sort -t '@' -k1,1 -k2,2V \
              | awk -F'@' '{ latest[$1] = $0 } END { for (m in latest) print latest[m] }')
            IDS=$(cut -d' ' -f2 "$RUNNER_TEMP/found.txt" | sort -u | paste -sd, -)

            : > "$RUNNER_TEMP/go-targets.txt"
            for bump in $FINAL; do
              module="${bump%%@*}"
              version="${bump##*@}"
              if [ "$module" = "stdlib" ]; then
                v="${version#go}"; v="${v#v}"
                echo "stdlib $v $v" >> "$RUNNER_TEMP/go-targets.txt"
              elif is_direct "$module"; then
                echo "$module $version $(newest_patch_module "$module" "$version")" >> "$RUNNER_TEMP/go-targets.txt"
              else
                echo "$module $version $version" >> "$RUNNER_TEMP/go-targets.txt"
              fi
            done

            {
              echo "Go bumps, pass $1 (govulncheck, called symbols only; minimum fix, direct modules then newest patch in that minor):"
              while read -r mod fixed target; do
                if [ "$fixed" = "$target" ]; then echo "- $mod $fixed"; else echo "- $mod $fixed -> $target"; fi
              done < "$RUNNER_TEMP/go-targets.txt"
              echo "Advisories: $IDS"
            } >> "$SUMMARY_FILE"

            while read -r mod fixed target; do
              if [ "$mod" = "stdlib" ]; then
                go mod edit -go="$target"
                continue
              fi
              # Never downgrade: an earlier `go get` may already have pulled this module past
              # its target, and `go get mod@version` would pin it back down (into a vulnerable
              # version, as a real test showed).
              current=$(go list -m -f '{{.Version}}' "$mod" 2>/dev/null || true)
              if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$target" | sort -V | tail -1)" = "$current" ]; then
                echo "Go: $mod already at $current (>= $target)"
                continue
              fi
              go get "$mod@$target"
            done < "$RUNNER_TEMP/go-targets.txt"
            go mod tidy
          }

          # Bumping one module can pull in another version with its own advisory, so repeat
          # until a scan is clean (bounded). The final gate re-checks everything.
          for pass in 1 2 3; do
            go_pass "$pass" || { [ "$pass" -eq 1 ] && echo "Go: no called vulnerabilities."; break; }
          done

      # ── Fix: npm ───────────────────────────────────────────────────────────
      # Bumps each vulnerable package to the LOWEST version that clears its advisories,
      # and, for DIRECT dependencies only, then to the newest patch release in that same minor
      # (not what `npm audit fix` does, which takes the newest in range and also
      # crashed/ERESOLVEd on a real repo).
      # Direct dependencies get their spec edited; vulnerable transitive ones get a pinned
      # `overrides` entry, tracked in package.json under "x-security-overrides" so only
      # overrides this job created are ever pruned (once nothing needs them any more).
      # Fixes are applied one at a time and rolled back individually if npm cannot
      # resolve them. When the minimum fix is in a later major, that major bump is applied
      # automatically too (the test gate decides whether it ships). Works without a
      # committed lockfile (a temporary one is generated and discarded).
      - name: npm - bump vulnerable packages to the minimum fixed version
        if: steps.detect.outputs.npm == 'true'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/npm-min-fix.mjs" <<'JS'
          import { execFileSync } from 'node:child_process';
          import { createRequire } from 'node:module';
          import fs from 'node:fs';

          const run = (args, opts = {}) => execFileSync('npm', args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'], ...opts });
          const npmRoot = run(['root', '-g']).trim();
          const semver = createRequire(`${npmRoot}/npm/package.json`)('semver'); // bundled with npm

          const summaryFile = process.env.SUMMARY_FILE;
          const failuresFile = `${process.env.RUNNER_TEMP}/npm-failures.txt`;
          const read = (f) => fs.readFileSync(f, 'utf8');
          const indent = (txt) => (txt.match(/^[ \t]+(?=")/m) || ['  '])[0];
          const writePkg = (pkg, txt) => fs.writeFileSync('package.json', JSON.stringify(pkg, null, indent(txt)) + '\n');
          const audit = () => {
            let out;
            try { out = run(['audit', '--json']); } catch (e) { out = e.stdout; } // exit 1 when vulnerable
            return JSON.parse(out || '{}');
          };
          const relock = () => run(['install', '--package-lock-only', '--ignore-scripts', '--no-audit', '--no-fund']);

          const MANAGED = 'x-security-overrides'; // overrides created by this job
          const applied = [], failed = [], manual = [], pruned = [];
          const urlsOf = (own) => [...new Set(own.map((x) => x.url).filter(Boolean))];

          const versionCache = new Map();
          const stableVersions = (name) => {
            if (!versionCache.has(name)) {
              const all = JSON.parse(run(['view', name, 'versions', '--json']));
              versionCache.set(name, all.filter((v) => !semver.prerelease(v)).sort(semver.compare));
            }
            return versionCache.get(name);
          };

          // The lowest stable version above `from` that no own-advisory range covers.
          function minFixed(name, from, ranges, sameMajor) {
            return stableVersions(name).find((v) => semver.gt(v, from)
              && (!sameMajor || semver.major(v) === semver.major(from))
              && !ranges.some((r) => semver.satisfies(v, r)));
          }

          // Direct dependencies only: then the newest patch in that same minor (patches are fixes only).
          // Transitive (override) fixes stay at the minimum.
          function newestPatch(name, to, ranges) {
            const same = stableVersions(name).filter((v) => semver.major(v) === semver.major(to)
              && semver.minor(v) === semver.minor(to) && semver.gte(v, to)
              && !ranges.some((r) => semver.satisfies(v, r)));
            return same.length ? same[same.length - 1] : to;
          }

          function plan(pass) {
            const a = audit();
            const lock = JSON.parse(read('package-lock.json'));
            const pkg = JSON.parse(read('package.json'));
            const direct = { ...pkg.optionalDependencies, ...pkg.devDependencies, ...pkg.dependencies };
            const out = [];
            for (const [name, v] of Object.entries(a.vulnerabilities ?? {})) {
              const own = (v.via ?? []).filter((x) => typeof x === 'object' && x.name === name);
              if (!own.length) continue; // vulnerable only through a dependency: fixed at its source
              const isDirect = name in direct;
              if ((pass === 'direct') !== isDirect) continue;
              const ranges = [...new Set(own.map((x) => x.range))];
              const installed = [...new Set((v.nodes ?? []).map((n) => lock.packages?.[n]?.version).filter(Boolean))].sort(semver.compare);
              if (!installed.length) { manual.push(`${name}: installed version not found in the lockfile`); continue; }
              // Lowest fix above each installed copy: inside its own major when one exists,
              // otherwise the lowest fix in a later major (applied automatically; the test gate
              // and per-fix rollback guard it). One pin must satisfy every installed copy.
              const targets = installed.map((f) => minFixed(name, f, ranges, true) ?? minFixed(name, f, ranges, false));
              if (targets.some((t) => !t)) { manual.push(`${name}@${installed.join(', ')}: no fixed version has been published yet`); continue; }
              const to = targets.sort(semver.compare).at(-1);
              const from = installed.join(' + ');
              out.push({ name, from, min: to, to: isDirect ? newestPatch(name, to, ranges) : to, isDirect, urls: urlsOf(own) });
            }
            return out;
          }

          function apply(fix) {
            const pkgTxt = read('package.json'), lockTxt = read('package-lock.json');
            const pkg = JSON.parse(pkgTxt);
            if (fix.isDirect) {
              for (const sec of ['dependencies', 'devDependencies', 'optionalDependencies']) {
                const spec = pkg[sec]?.[fix.name];
                if (spec === undefined) continue;
                const prefix = /^[\^~]/.test(spec) ? spec[0] : '';
                pkg[sec][fix.name] = prefix + fix.to;
              }
            } else {
              pkg.overrides = { ...(pkg.overrides ?? {}), [fix.name]: fix.to };
              pkg[MANAGED] = [...new Set([...(pkg[MANAGED] ?? []), fix.name])];
            }
            writePkg(pkg, pkgTxt);
            try {
              relock();
              applied.push(fix);
            } catch (e) {
              fs.writeFileSync('package.json', pkgTxt);
              fs.writeFileSync('package-lock.json', lockTxt);
              failed.push(`${fix.name} ${fix.from} -> ${fix.to}: ${(e.stderr || e.message).split('\n').find((l) => /ERESOLVE|error/.test(l)) ?? 'npm could not resolve it'}`);
            }
          }

          // Drop overrides this job added once nothing needs them: remove one, re-resolve,
          // and keep it removed only if the package is no longer reported vulnerable.
          function prune() {
            const start = JSON.parse(read('package.json'));
            for (const name of [...(start[MANAGED] ?? [])]) {
              const pkgTxt = read('package.json'), lockTxt = read('package-lock.json');
              const pkg = JSON.parse(pkgTxt);
              if (pkg.overrides) { delete pkg.overrides[name]; if (!Object.keys(pkg.overrides).length) delete pkg.overrides; }
              pkg[MANAGED] = (pkg[MANAGED] ?? []).filter((n) => n !== name);
              if (!pkg[MANAGED].length) delete pkg[MANAGED];
              writePkg(pkg, pkgTxt);
              let clean = false;
              try {
                relock();
                const v = audit().vulnerabilities?.[name];
                clean = !(v && (v.via ?? []).some((x) => typeof x === 'object' && x.name === name));
              } catch { /* keep the override */ }
              if (clean) pruned.push(name);
              else { fs.writeFileSync('package.json', pkgTxt); fs.writeFileSync('package-lock.json', lockTxt); }
            }
          }

          prune();
          for (const pass of ['direct', 'transitive']) {
            for (const fix of plan(pass)) apply(fix);
          }

          const lines = applied.map((f) => `- ${f.name} ${f.from} -> ${f.to}${f.to !== f.min ? ` (minimum fix ${f.min}, then newest patch in that minor)` : ''}${f.isDirect ? '' : ' (override)'} ${f.urls.join(' ')}`);
          if (lines.length) fs.appendFileSync(summaryFile, `npm fixes (minimum fix; direct deps then newest patch in that minor):\n${lines.join('\n')}\n`);
          if (pruned.length) fs.appendFileSync(summaryFile, `npm overrides no longer needed, removed: ${pruned.join(', ')}\n`);
          for (const m of manual) console.log(`::warning::npm: ${m}`);
          if (failed.length) fs.writeFileSync(failuresFile, failed.map((f) => `- ${f}`).join('\n') + '\n');
          console.log(`npm: ${applied.length} fixed, ${pruned.length} overrides pruned, ${failed.length} could not be applied, ${manual.length} have no published fix`);
          JS

          # The npm bundled with some Node releases crashes on certain trees
          # ("Cannot read properties of null (reading 'edgesOut')"); current npm does not.
          npm install -g npm@latest || echo "::warning::could not upgrade npm; using the bundled one"

          had_lock=true
          [ -f package-lock.json ] || { had_lock=false; npm install --package-lock-only --ignore-scripts --no-audit --no-fund; }
          npm ci --no-audit --no-fund --ignore-scripts
          node "$RUNNER_TEMP/npm-min-fix.mjs"
          # A lockfile we generated only for the audit is not part of the repo.
          [ "$had_lock" = "true" ] || rm -f package-lock.json

      - name: Extra fixes (repo script)
        if: inputs.extra_fix_script != ''
        env:
          EXTRA: ${{ inputs.extra_fix_script }}
          GOTOOLCHAIN: auto
        run: bash -c "$EXTRA"

      # ── Gate and push ──────────────────────────────────────────────────────
      - name: Commit fixes
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nothing to fix."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Tracked files only: never sweep node_modules or build output into the commit.
          git add -u
          {
            echo "chore: security bumps"
            echo
            cat "$SUMMARY_FILE"
            echo
            echo "Automated by the sloccy/shared-ci security workflow."
          } > "$RUNNER_TEMP/commit-msg.txt"
          git commit -q -F "$RUNNER_TEMP/commit-msg.txt"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Gate - tests
        if: steps.commit.outputs.changed == 'true'
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
          HAS_GO: ${{ steps.detect.outputs.go }}
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          if [ -n "$TEST_COMMAND" ]; then
            bash -c "$TEST_COMMAND"
          elif [ "$HAS_GO" = "true" ]; then
            go build ./... && go test ./...
          else
            npm ci --no-audit --no-fund && npm test --if-present
          fi

      - name: Gate - lint (optional)
        if: steps.commit.outputs.changed == 'true' && inputs.lint_command != ''
        env:
          LINT_COMMAND: ${{ inputs.lint_command }}
          GOTOOLCHAIN: auto
        run: bash -c "$LINT_COMMAND"

      - name: Gate - no called vulnerabilities remain
        if: steps.commit.outputs.changed == 'true' && steps.detect.outputs.go == 'true'
        env:
          GOTOOLCHAIN: auto
        run: govulncheck ./...

      - name: Push
        id: push
        if: steps.commit.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.detect.outputs.branch }}
        run: |
          set -euo pipefail
          {
            echo "### Fix commit"
            git log -1 --format='%B'
            git show --stat --format= HEAD
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: not pushing."
            git show --stat --format=%s HEAD
            exit 0
          fi
          if ! git push origin "HEAD:$BRANCH"; then
            echo "Push rejected; rebasing once onto the updated branch."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            git push origin "HEAD:$BRANCH"
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Fail if some fixes could not be applied
        if: always() && steps.detect.outputs.npm == 'true'
        run: |
          if [ -s "$RUNNER_TEMP/npm-failures.txt" ]; then
            echo "::error::Some npm fixes could not be applied (the others were pushed):"
            cat "$RUNNER_TEMP/npm-failures.txt"
            exit 1
          fi

      # ── Shipped binaries (e.g. cloudflared) ────────────────────────────────
      - name: Scan shipped binaries
        if: inputs.binaries != ''
        env:
          BINARIES: ${{ inputs.binaries }}
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          status=0
          n=0
          while read -r url; do
            [ -z "$url" ] && continue
            n=$((n + 1))
            f="$RUNNER_TEMP/bin/$n"
            curl -fsSL -o "$f" "$url"
            echo "::group::govulncheck -mode=binary $url"
            govulncheck -mode=binary "$f" || status=1
            echo "::endgroup::"
          done <<< "$BINARIES"
          exit $status

      # ── GitHub Actions pins ────────────────────────────────────────────────
      # Policy exception: actions move to the newest stable major (at least actions_min_age_days
      # old) instead of the minimum fixed version. They are CI tooling, not shipped code, and
      # majors are how they retire old runtimes. Runs last so a token that cannot write
      # workflow files never blocks the security fixes pushed above.
      - name: Actions - bump pinned versions
        id: actions
        if: inputs.bump_actions
        env:
          MIN_AGE: ${{ inputs.actions_min_age_days }}
          RUN_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The commit of this reusable workflow, as the run itself records it, so the script
          # matches the workflow version the caller pinned (a tag or a branch under test).
          sha=$(GH_TOKEN="$RUN_TOKEN" gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '.referenced_workflows[] | select(.path | startswith("sloccy/shared-ci/")) | .sha' | head -1 || true)
          curl -fsSL "https://raw.githubusercontent.com/sloccy/shared-ci/${sha:-v1}/scripts/bump-actions.sh" \
            -o "$RUNNER_TEMP/bump-actions.sh"
          : > "$RUNNER_TEMP/actions-summary.md"
          SUMMARY_FILE="$RUNNER_TEMP/actions-summary.md" bash "$RUNNER_TEMP/bump-actions.sh" "$MIN_AGE"
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Actions - lint the changed workflows
        if: steps.actions.outputs.changed == 'true'
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest "$RUNNER_TEMP"
          # shellcheck and pyflakes are off: this gate is about the bump, not the repo's existing scripts
          git diff --name-only | xargs "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

      - name: Actions - commit and push
        id: actions_push
        if: steps.actions.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.detect.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          {
            echo "chore: update GitHub Actions"
            echo
            cat "$RUNNER_TEMP/actions-summary.md"
            echo
            echo "Automated by the sloccy/shared-ci security workflow."
          } > "$RUNNER_TEMP/actions-msg.txt"
          git commit -q -F "$RUNNER_TEMP/actions-msg.txt"
          {
            echo "### GitHub Actions bumped"
            cat "$RUNNER_TEMP/actions-summary.md"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/actions-summary.md" >> "$SUMMARY_FILE"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: not pushing."
            git show --stat --format=%s HEAD
            exit 0
          fi
          if ! out=$(git push origin "HEAD:$BRANCH" 2>&1); then
            echo "$out"
            if grep -qi 'workflow' <<< "$out"; then
              echo "::error::The token cannot update workflow files. Give WORKFLOW_TOKEN 'Workflows: Read and write' (fine-grained token) or the 'workflow' scope (classic) for this repository, or set bump_actions: false."
              exit 1
            fi
            echo "Push rejected; rebasing once onto the updated branch."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            git push origin "HEAD:$BRANCH"
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A bad major can break the repo's own build. Report it (the failure issue names the commit
      # to revert) rather than reverting automatically.
      - name: Actions - watch the repo's build on the pushed commit
        if: steps.actions_push.outputs.pushed == 'true' && inputs.watch_minutes > 0
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.actions_push.outputs.sha }}
          MINUTES: ${{ inputs.watch_minutes }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          runs() { gh run list --commit "$SHA" --limit 50 --json databaseId,name,status,conclusion \
            --jq "[.[] | select(.databaseId != $THIS_RUN)]"; }
          # runs on the pushed commit take a moment to appear (none will on a scratch branch)
          for _ in $(seq 10); do
            [ "$(runs | jq length)" -gt 0 ] && break
            sleep 30
          done
          if [ "$(runs | jq length)" -eq 0 ]; then
            echo "::notice::No workflow run started for $SHA within 5 minutes; nothing to watch."
            exit 0
          fi
          deadline=$(( $(date +%s) + MINUTES * 60 ))
          while :; do
            j=$(runs)
            bad=$(jq -r '.[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure") | .name' <<< "$j")
            if [ -n "$bad" ]; then
              {
                echo
                echo "The repo's build failed after the actions bump ($SHA): $(echo "$bad" | paste -sd, -)."
                echo "If the bump is the cause, undo it with: git revert $SHA"
              } | tee -a "$SUMMARY_FILE"
              echo "::error::Build failed after the actions bump. Revert with: git revert $SHA"
              exit 1
            fi
            if [ "$(jq '[.[] | select(.status != "completed")] | length' <<< "$j")" -eq 0 ]; then
              echo "The repo's build passed on $SHA."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::notice::The build was still running after $MINUTES minutes; not waiting longer."
              exit 0
            fi
            sleep 30
          done

      # ── Weekly rebuild ─────────────────────────────────────────────────────
      - name: Weekly rebuild
        if: inputs.rebuild_workflow != '' && steps.push.outputs.pushed != 'true' && steps.actions_push.outputs.pushed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ inputs.rebuild_workflow }}
          WEEKDAY: ${{ inputs.rebuild_weekday }}
          FORCE: ${{ inputs.force_rebuild }}
          BRANCH: ${{ steps.detect.outputs.branch }}
        run: |
          set -euo pipefail
          # A push above already triggered a fresh build, so skip the duplicate.
          if [ "$FORCE" != "true" ] && [ "$(date -u +%u)" != "$WEEKDAY" ]; then
            echo "Not rebuild day; skipping."
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would dispatch $WORKFLOW on $BRANCH."
            exit 0
          fi
          gh workflow run "$WORKFLOW" --ref "$BRANCH"

      # ── Keep the schedule alive ────────────────────────────────────────────
      # GitHub disables scheduled workflows in public repos after 60 days without repo
      # activity. Re-enabling this workflow is a best-effort way to reset that timer
      # (community-reported, not documented).
      - name: Keep schedule enabled
        if: github.event_name == 'schedule' && inputs.target_branch == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          ref="${WORKFLOW_REF%%@*}"
          gh workflow enable "$(basename "$ref")"

      # ── One failure channel ────────────────────────────────────────────────
      - name: Report failure
        if: failure() && inputs.dry_run != true && inputs.target_branch == ''
        env:
          GH_TOKEN: ${{ github.token }} # not the PAT: self-authored activity would not email the owner
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label=security-automation-failure
          gh label create "$label" --color B60205 --description "Nightly security automation failed" 2>/dev/null || true
          body="The nightly security job failed, so this repo may have no vulnerability coverage until it is fixed.

          Latest run: $RUN_URL"
          if [ -s "$SUMMARY_FILE" ]; then
            body="$body

          Fixes it was trying to apply:
          $(cat "$SUMMARY_FILE")"
          fi
          if [ -s "$RUNNER_TEMP/npm-failures.txt" ]; then
            body="$body

          npm fixes that could not be applied:
          $(cat "$RUNNER_TEMP/npm-failures.txt")"
          fi
          existing=$(gh issue list --label "$label" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL" \
              || echo "::warning::could not comment on issue #$existing (the caller needs issues: write)"
          else
            gh issue create --title "Security automation is failing" --label "$label" --body "$body" \
              || echo "::warning::could not open an issue (the caller needs issues: write)"
          fi

      - name: Close failure issue
        if: success() && inputs.dry_run != true && inputs.target_branch == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label security-automation-failure --state open --json number --jq '.[].number' 2>/dev/null || true); do
            gh issue close "$n" --comment "Recovered: $RUN_URL" || true
          done
