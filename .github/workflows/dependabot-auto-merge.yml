name: Dependabot auto-merge

on:
  workflow_call:
    secrets:
      merge_token:
        description: >-
          PAT used to enable auto-merge. Without it, auto-merge is enabled with
          GITHUB_TOKEN and the eventual merge push cannot trigger the caller repo's
          deploy/push workflows (GitHub does not let GITHUB_TOKEN events start
          workflows). Optional; merging still works without it.
        required: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      # All caller repos set open-pull-requests-limit: 0, disabling routine version
      # updates — so every Dependabot PR here is a security update. Merge unconditionally
      # (still gated on CI by --auto). This is what catches grouped security updates,
      # which carry neither the 'security' label nor a semver-patch update-type, and
      # so fell through the old label/update-type checks.
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.merge_token || secrets.GITHUB_TOKEN }}
